<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background:#0d0d12; color:#eee; margin:0; padding:20px; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:22px; }
  section { background:#17171f; border-radius:14px; padding:20px; margin-bottom:20px; }
  h2 { font-size:16px; margin-top:0; }
  input, select { width:100%; box-sizing:border-box; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #333; background:#0d0d12; color:#fff; }
  button { padding:10px 18px; border:none; border-radius:8px; background:#0a84ff; color:#fff; font-weight:600; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:right; padding:8px; border-bottom:1px solid #2a2a33; }
  .token-row { display:flex; gap:8px; margin-bottom:20px; }
  .token-row input { margin:0; }
  .muted { color:#888; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>لوحة تحكم المتجر</h1>

  <div class="token-row">
    <input id="token" placeholder="Admin token" type="password">
    <button onclick="saveToken()">حفظ</button>
  </div>

  <section>
    <h2>الشهادة (مرة وحدة)</h2>
    <div id="certStatus" class="muted">جارِ التحقق...</div>
    <input id="p12" type="file" accept=".p12" placeholder="ملف .p12">
    <input id="p12_password" type="password" placeholder="كلمة سر الشهادة">
    <input id="provision" type="file" accept=".mobileprovision" placeholder="ملف .mobileprovision">
    <button onclick="uploadCert()">حفظ الشهادة</button>
    <div id="certMsg" class="muted"></div>
  </section>

  <section>
    <h2>إضافة تطبيق (IPA غير موقّع — التوقيع يصير تلقائياً)</h2>
    <input id="name" placeholder="اسم التطبيق">
    <input id="bundle_id" placeholder="Bundle ID (مثال: com.yourcompany.app)">
    <input id="version" placeholder="رقم الإصدار (مثال: 1.0)">
    <input id="icon_url" placeholder="رابط الأيقونة (اختياري)">
    <input id="ipa" type="file" accept=".ipa">
    <button onclick="addApp()">إضافة</button>
    <div id="appMsg" class="muted"></div>
  </section>

  <section>
    <h2>توليد كود</h2>
    <select id="appSelect"></select>
    <button onclick="genCode()">توليد كود جديد</button>
    <div id="codeMsg" class="muted"></div>
  </section>

  <section>
    <h2>الأكواد</h2>
    <table id="codesTable"><thead><tr><th>الكود</th><th>التطبيق</th><th>الحالة</th><th>ينتهي</th></tr></thead><tbody></tbody></table>
  </section>
</div>

<script>
function token() { return localStorage.getItem('admin_token') || ''; }
function saveToken() {
  localStorage.setItem('admin_token', document.getElementById('token').value);
  loadApps(); loadCodes();
}
document.getElementById('token').value = token();

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'x-admin-token': token() }, opts.headers || {});
  const res = await fetch(path, opts);
  return res.json();
}

async function loadApps() {
  const apps = await api('/admin/apps');
  const sel = document.getElementById('appSelect');
  sel.innerHTML = (apps || []).map(a => `<option value="${a.id}">${a.name} (v${a.version})</option>`).join('');
}

async function loadCodes() {
  const codes = await api('/admin/codes');
  const tbody = document.querySelector('#codesTable tbody');
  tbody.innerHTML = (codes || []).map(c => `
    <tr>
      <td>${c.code}</td>
      <td>${c.app_name}</td>
      <td>${c.status}</td>
      <td>${c.expires_at ? new Date(c.expires_at).toLocaleDateString('ar') : '-'}</td>
    </tr>`).join('');
}

async function loadCertStatus() {
  const data = await api('/admin/certificate');
  document.getElementById('certStatus').textContent = data.uploaded
    ? `الشهادة مرفوعة (${new Date(data.uploaded_at).toLocaleString('ar')})`
    : 'ما في شهادة مرفوعة بعد';
}

async function uploadCert() {
  const fd = new FormData();
  fd.append('p12', document.getElementById('p12').files[0]);
  fd.append('p12_password', document.getElementById('p12_password').value);
  fd.append('provision', document.getElementById('provision').files[0]);
  const data = await api('/admin/certificate', { method: 'POST', body: fd });
  document.getElementById('certMsg').textContent = data.ok ? 'تم حفظ الشهادة' : data.error;
  loadCertStatus();
}

async function addApp() {
  const fd = new FormData();
  fd.append('name', document.getElementById('name').value);
  fd.append('bundle_id', document.getElementById('bundle_id').value);
  fd.append('version', document.getElementById('version').value);
  fd.append('icon_url', document.getElementById('icon_url').value);
  fd.append('ipa', document.getElementById('ipa').files[0]);
  const data = await api('/admin/apps', { method: 'POST', body: fd });
  document.getElementById('appMsg').textContent = data.error ? data.error : `تمت إضافة ${data.name}`;
  loadApps();
}

async function genCode() {
  const app_id = document.getElementById('appSelect').value;
  const data = await api('/admin/codes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ app_id })
  });
  document.getElementById('codeMsg').textContent = data.code ? `الكود: ${data.code}` : data.error;
  loadCodes();
}

loadApps(); loadCodes(); loadCertStatus();
</script>
</body>
</html>
